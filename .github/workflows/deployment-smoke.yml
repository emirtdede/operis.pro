name: Deployed contract PDF verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-pdf:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.DEPLOYMENT_URL }}
      SMOKE_CONTRACT_ID: ${{ secrets.SMOKE_CONTRACT_ID }}
      SMOKE_AUTH_TOKEN: ${{ secrets.SMOKE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify authenticated PDF or browser print fallback
        run: pnpm exec tsx scripts/verify-deployment-pdf.ts
